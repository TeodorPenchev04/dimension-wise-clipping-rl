# ============================================================
# Shared PPO / DISC experiment configuration
# Based on Han & Sung (2019) and OpenAI Baselines PPO2
# ============================================================

# Discounting / advantage estimation
gamma: 0.99
gae_lambda: 0.95

# Rollout
rollout_steps: 2048

# Optimization
epochs: 10
gradient_steps_per_epoch: 32
minibatch_size: 64

# Learning-rate schedule
learning_rate_initial: 0.0003
learning_rate_min: 0.0001
anneal_learning_rate: true

# PPO / DISC main controlled clipping ratio
clip_ratio: 0.2

# PPO2 loss settings
value_loss_coef: 0.5
entropy_coef: 0.0
max_grad_norm: 0.5
adam_epsilon: 0.00001

# Advantage normalization
normalize_advantages: true

# MuJoCo normalization
normalize_observations: true
normalize_rewards: true

observation_clip: 10.0
reward_clip: 10.0
normalization_epsilon: 0.00000001

# Network
hidden_sizes:
  - 64
  - 64

activation: tanh

# ============================================================
# DISC-specific
# ============================================================

jis_target: 0.001
alpha_is_initial: 1.0

# Full DISC replay
replay_length: 64
batch_inclusion_epsilon: 0.1